[package]
name = "speech2text"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "cuda", "ndarray"] }
ndarray = "0.17"
ffmpeg-next = "8.1"
hound = "3.5"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
knf-rs = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
