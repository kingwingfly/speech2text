[package]
name = "stt"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "stt"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# Shared between server (ssr) and browser (hydrate).
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ssr-only: web server, CLI, and the native STT pipeline.
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "cuda", "ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }
ffmpeg-next = { version = "8.1", optional = true }
hound = { version = "3.5", optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }
knf-rs = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# hydrate-only: the browser (wasm) side.
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window", "Document", "Location", "Navigator", "Performance",
    "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints",
    "AudioContext", "AudioContextOptions", "BaseAudioContext", "AudioNode",
    "AudioDestinationNode", "MediaStreamAudioSourceNode", "ScriptProcessorNode",
    "AudioProcessingEvent", "AudioBuffer", "GainNode", "AudioParam",
    "WebSocket", "BinaryType", "MessageEvent", "Event", "CloseEvent", "ErrorEvent",
] }

[features]
default = ["ssr"]
ssr = [
    "dep:leptos_axum", "dep:axum", "dep:tokio", "dep:tower", "dep:tower-http",
    "dep:clap", "dep:ort", "dep:ndarray", "dep:ffmpeg-next", "dep:hound",
    "dep:hf-hub", "dep:knf-rs", "dep:anyhow", "dep:tracing", "dep:tracing-subscriber",
    "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr",
]
hydrate = [
    "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys",
    "dep:console_error_panic_hook", "dep:web-sys", "leptos/hydrate",
]

[package.metadata.leptos]
output-name = "stt"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/tailwind.css"
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
